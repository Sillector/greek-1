<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Λεμονιές — Лимонный квартал</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='12' ry='9' fill='%23f4c84a' stroke='%232b2a33' stroke-width='2'/%3E%3Cpath d='M16 8c3-5 8-5 10-3-3 2-6 3-10 3z' fill='%235e8c3a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="cover">
    <div id="cover-art"></div>
    <div class="cover-text">
        <div class="cover-kicker">игра без переводчика</div>
        <h1><span class="gr">Λεμονιές</span><small>Лимонный квартал</small></h1>
        <p>Маленький греческий квартал, старая открытка и пятьдесят слов, которые вам предстоит понять самим — по лицам, вывескам и делам здешних жителей.</p>
        <button type="button" class="btn primary big" id="btn-start">Начать</button>
        <div class="cover-note">со звуком · прогресс сохраняется</div>
    </div>
</div>

<div id="app" class="hidden">
    <header id="top">
        <div class="brand"><span class="lemon"></span><span class="gr">Λεμονιές</span></div>
        <div class="where" id="loc-name"></div>
        <div class="progress"><div id="seals" class="seals"></div><div class="count"><span id="count">0 / 50</span><small>слов понято</small></div></div>
        <div class="actions">
            <button type="button" class="btn ghost" id="btn-postcard" title="Открытка">✉ Открытка</button>
            <button type="button" class="btn journal-btn" id="btn-journal" title="Дневник (J)">📖 Дневник <span class="badge"></span></button>
            <button type="button" class="btn ghost" id="btn-voices" title="Голоса озвучки">🗣 Голоса</button>
            <button type="button" class="btn ghost icon" id="btn-sound" title="Звуки интерфейса">♪</button>
            <button type="button" class="btn ghost icon" id="btn-reset" title="Начать заново">↺</button>
        </div>
    </header>
    <main id="main">
        <div id="stage">
            <div id="scene-holder"></div>
            <div id="bubble" class="bubble"></div>
        </div>
        <nav id="places"></nav>
    </main>
</div>

<div id="journal" class="overlay">
    <div class="book">
        <div class="book-tabs">
            <button type="button" class="tab" data-tab="pages">Страницы</button>
            <button type="button" class="tab" data-tab="words">Незнакомые слова</button>
            <button type="button" class="tab" data-tab="heard">Услышанное</button>
            <button type="button" class="tab" data-tab="postcard">Открытка</button>
            <button type="button" class="tab" data-tab="review">Повторение</button>
            <button type="button" class="btn ghost close" data-close="#journal">✕</button>
        </div>
        <div id="j-body" class="j-body"></div>
    </div>
</div>

<div id="sign" class="overlay"><div id="sign-card" class="sign-card"></div><button type="button" class="btn ghost float-close" data-close="#sign">✕</button></div>
<div id="voices" class="overlay"><div id="voices-card" class="voices-card"></div></div>
<div id="quest" class="overlay"><div id="quest-card" class="quest-card"></div></div>
<div id="story" class="overlay"><div id="story-card" class="story-card"></div></div>
<div id="finale" class="overlay finale"></div>

<div id="tip" class="tip" role="tooltip"></div>
<div id="wordpop" class="wordpop" role="dialog" aria-label="Догадка о слове"></div>
<div id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/art.js"></script>
<script src="js/sound.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
